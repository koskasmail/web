<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Today & Month Countdown</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                radial-gradient(circle at top left,
                    #8b9cff 0%,
                    transparent 40%),
                linear-gradient(135deg,
                    #667eea,
                    #764ba2);
        }

        .card {
            width: 100%;
            max-width: 600px;

            padding: 45px 35px;

            text-align: center;

            background: rgba(255, 255, 255, 0.96);

            border-radius: 28px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.25);

            backdrop-filter: blur(10px);
        }

        /* TODAY */

        .label {
            margin-bottom: 10px;

            color: #777;

            font-size: 0.85rem;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .date {
            margin-bottom: 45px;

            color: #222;

            font-size: clamp(2.5rem, 10vw, 4.5rem);
            font-weight: 800;

            line-height: 1;
            letter-spacing: -2px;
        }

        /* COUNTDOWN */

        .month-title {
            margin-bottom: 18px;

            color: #555;

            font-size: 1.1rem;
            font-weight: 600;
        }

        .countdown {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;
        }

        .time-box {
            padding: 18px 8px;

            background: #f4f3ff;

            border: 1px solid rgba(118, 75, 162, 0.08);

            border-radius: 16px;
        }

        .time-value {
            display: block;

            color: #6c63d9;

            font-size: clamp(1.7rem, 6vw, 2.5rem);
            font-weight: 800;

            line-height: 1;
        }

        .time-label {
            display: block;

            margin-top: 8px;

            color: #888;

            font-size: 0.7rem;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* MOBILE */

        @media (max-width: 480px) {
            .card {
                padding: 35px 18px;
                border-radius: 22px;
            }

            .date {
                margin-bottom: 35px;
            }

            .countdown {
                gap: 6px;
            }

            .time-box {
                padding: 15px 5px;
                border-radius: 12px;
            }

            .time-label {
                font-size: 0.6rem;
                letter-spacing: 0.5px;
            }
        }

        @media (max-width: 350px) {
            .countdown {
                grid-template-columns: repeat(2, 1fr);
            }

            .time-box {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <!-- Today's date -->
        <div class="label">
            Today:
        </div>

        <div class="date" id="today">
            --/--/----
        </div>


        <!-- Countdown -->
        <div class="label">
            End of month
        </div>

        <div class="countdown">

            <div class="time-box">
                <span class="time-value" id="days">
                    00
                </span>

                <span class="time-label">
                    Days
                </span>
            </div>


            <div class="time-box">
                <span class="time-value" id="hours">
                    00
                </span>

                <span class="time-label">
                    Hours
                </span>
            </div>


            <div class="time-box">
                <span class="time-value" id="minutes">
                    00
                </span>

                <span class="time-label">
                    Minutes
                </span>
            </div>


            <div class="time-box">
                <span class="time-value" id="seconds">
                    00
                </span>

                <span class="time-label">
                    Seconds
                </span>
            </div>

        </div>

    </main>


    <script>

        function updateCountdown() {

            const now = new Date();


            /*
             * TODAY
             *
             * Format:
             * dd/mm/yyyy
             */

            const day = String(
                now.getDate()
            ).padStart(2, "0");

            const month = String(
                now.getMonth() + 1
            ).padStart(2, "0");

            const year = now.getFullYear();


            document.getElementById("today").textContent =
                `${day}/${month}/${year}`;


            /*
             * END OF CURRENT MONTH
             *
             * Date(year, month + 1, 1)
             * gives us the first day of next month.
             *
             * Therefore, the countdown ends
             * exactly when the current month ends.
             */

            const endOfMonth = new Date(
                now.getFullYear(),
                now.getMonth() + 1,
                1
            );


            /*
             * Difference in milliseconds
             */

            const difference =
                endOfMonth.getTime() - now.getTime();


            /*
             * Convert milliseconds
             * into days / hours / minutes / seconds
             */

            const days = Math.floor(
                difference /
                (1000 * 60 * 60 * 24)
            );

            const hours = Math.floor(
                (difference /
                    (1000 * 60 * 60)) % 24
            );

            const minutes = Math.floor(
                (difference /
                    (1000 * 60)) % 60
            );

            const seconds = Math.floor(
                (difference / 1000) % 60
            );


            /*
             * Display values
             */

            document.getElementById("days")
                .textContent = String(days).padStart(2, "0");

            document.getElementById("hours")
                .textContent = String(hours).padStart(2, "0");

            document.getElementById("minutes")
                .textContent = String(minutes).padStart(2, "0");

            document.getElementById("seconds")
                .textContent = String(seconds).padStart(2, "0");
        }


        /*
         * Run immediately
         */

        updateCountdown();


        /*
         * Update every second
         */

        setInterval(
            updateCountdown,
            1000
        );

    </script>

</body>

</html>
