<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404...#01</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .error-code {
            font-size: 8rem;
            font-weight: bold;
            color: #ff4d4d;
        }

        .message {
            font-size: 1.2rem;
            margin: 15px 0;
            color: #333;
        }

        button {
            padding: 12px 25px;
            font-size: 1rem;
            border: none;
            background: #ff4d4d;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #e60000;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .error-code {
                font-size: 5rem;
            }

            .message {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="error-code">404</h1>
        <p class="message">Oops! The page you're looking for doesn't exist.</p>
        <button id="goBackBtn">Go Back</button>
    </div>

    <script>
        document.getElementById("goBackBtn").addEventListener("click", () => {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "https://www.google.com";
            }
        });
    </script>
</body>

</html>
