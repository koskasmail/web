<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404...#02</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Courier New", monospace;
        }

        body {
            background: black;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #00ff55;
        }

        /* CRT container */
        .crt {
            padding: 40px;
            text-align: center;
            border: 2px solid #00ff55;
            width: 90%;
            max-width: 500px;
            position: relative;
            box-shadow: 0 0 20px #00ff55;
        }

        /* Scanlines */
        .crt::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(to bottom,
                    rgba(0, 255, 85, 0.05) 0px,
                    rgba(0, 255, 85, 0.05) 2px,
                    transparent 2px,
                    transparent 4px);
        }

        /* Flicker animation */
        @keyframes flicker {
            0% {
                opacity: 0.9;
            }

            5% {
                opacity: 1;
            }

            10% {
                opacity: 0.85;
            }

            15% {
                opacity: 1;
            }

            20% {
                opacity: 0.9;
            }

            100% {
                opacity: 1;
            }
        }

        .crt {
            animation: flicker 0.15s infinite;
        }

        h1 {
            font-size: 6rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ff55;
        }

        p {
            font-size: 1.3rem;
            margin-bottom: 25px;
            text-shadow: 0 0 5px #00ff55;
        }

        button {
            padding: 10px 25px;
            background: transparent;
            border: 2px solid #00ff55;
            color: #00ff55;
            font-size: 1rem;
            cursor: pointer;
            text-shadow: 0 0 5px #00ff55;
            transition: 0.3s;
        }

        button:hover {
            background: #00ff55;
            color: black;
        }
    </style>
</head>

<body>

    <div class="crt">
        <div class="content">
            <h1>404</h1>
            <p>PAGE NOT FOUND</p>
            <button id="goBackBtn">RETURN</button>
        </div>
    </div>


    <script>
        document.getElementById("goBackBtn").addEventListener("click", () => {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "https://www.google.com";
            }
        });
    </script>

</body>

</html>
